<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Build: From Parts to First Boot</title>
  <meta name="description" content="Build a whole PC in 3D, in English and Chinese: power supply, motherboard, graphics card, fans and cables go into the case one step at a time, then the first power-on and taking it apart again.">
  <link rel="canonical" href="https://majiayu000.github.io/hardware-bench/boards/pc-build/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Hardware Bench">
  <meta property="og:title" content="PC Build: From Parts to First Boot">
  <meta property="og:description" content="Build a whole PC in 3D, in English and Chinese: power supply, motherboard, graphics card, fans and cables go into the case one step at a time, then the first power-on and taking it apart again.">
  <meta property="og:url" content="https://majiayu000.github.io/hardware-bench/boards/pc-build/">
  <meta property="og:image" content="https://majiayu000.github.io/hardware-bench/boards/pc-build/cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a6dd0'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23ffcc33'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='white'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='white'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../../engine/fonts/fonts.css">
  <link rel="stylesheet" href="../../engine/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../../engine/vendor/three/three.module.min.js",
        "three/addons/": "../../engine/vendor/three/addons/",
        "content": "./content.js",
        "content-zh": "./zh.js"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text">
        <small>Hardware Bench</small>
        <strong id="siteTitle"></strong>
      </span>
    </a>
    <nav class="topnav" aria-label="Main">
      <button type="button" data-view="lessons" data-icon="book" data-size="16" aria-pressed="false"><span>Lessons</span></button>
      <button type="button" data-view="components" data-icon="chip" data-size="16" aria-pressed="false"><span>Parts</span></button>
      <button type="button" data-view="settings" data-icon="gear" data-size="16" aria-pressed="false"><span>Settings</span></button>
    </nav>
    <div class="topbar-right">
      <div class="progress" aria-live="polite" title="Progress">
        <span class="progress-track"><span class="progress-fill" id="progressFill"></span></span>
        <span class="progress-count" id="progressCount"></span>
      </div>
      <button class="icon-btn help-btn" id="helpBtn" type="button" aria-label="How to use this course" title="How to use this course">?</button>
      <button class="icon-btn lang-btn" id="langToggle" type="button" aria-label="Switch language / 切换语言"></button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>
  <div class="side-pop" id="sidePop" hidden></div>

  <main class="layout">
    <section class="panel" aria-label="Lesson">
      <div class="panel-head">
        <ol class="stepper" id="lessonRail" aria-label="Lessons"></ol>
        <p class="eyebrow" id="lessonEyebrow"></p>
        <h1 id="lessonTitle"></h1>
        <p class="lede" id="lessonSummary"></p>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tab-body" id="tabBody" role="tabpanel"></div>
      <footer class="panel-foot">
        <button class="btn ghost" id="prevBtn" type="button"></button>
        <button class="btn" id="nextBtn" type="button"></button>
      </footer>
    </section>

    <section class="stage" aria-label="Board viewer">
      <div class="viewport" id="viewport"><p class="stage-loading" id="stageLoading">Loading the 3D view…</p></div>
      <div class="marks" id="marks"></div>
      <div class="bubbles" id="bubbles" aria-live="polite"></div>
      <div class="part-pop" id="partPop" hidden></div>
      <canvas class="minimap" id="minimap" width="150" height="110" aria-hidden="true"></canvas>
      <details class="key" id="key" open>
        <summary>Key</summary>
        <ol class="key-list" id="keyList"></ol>
      </details>
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="View">
        <button type="button" data-act="zin" data-icon="plus" data-size="18" aria-label="Zoom in"></button>
        <button type="button" data-act="zout" data-icon="minus" data-size="18" aria-label="Zoom out"></button>
        <i class="sep"></i>
        <button type="button" data-act="rotl" data-icon="rotl" data-size="18" aria-label="Turn left"></button>
        <button type="button" data-act="rotr" data-icon="rotr" data-size="18" aria-label="Turn right"></button>
        <i class="sep"></i>
        <button type="button" data-act="reset" data-icon="target" data-size="18" aria-label="Reset view"></button>
        <button type="button" data-act="labels" data-icon="info" data-size="18" aria-label="Show or hide labels"></button>
      </div>
      <div class="tooltip" id="tooltip" role="status" hidden></div>
    </section>
  </main>

  <script type="module" src="../../engine/app.js"></script>
</body>
</html>
